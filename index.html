const retainedQuestions={"spr":{"topic":3,"prompt":"В центре 10 ББ. У вас осталось 80 ББ, у соперника 100 ББ. Каков SPR для этой пары игроков?","options":["8","10","18"],"answer":0,"why":["Взаимно разыграть можно ещё по 80 ББ. SPR = 80/10 = 8.","Возьмите меньший из двух остатков. Соперник сможет получить от вас только 80 ББ. 80/10 = 8.","Остатки двух игроков не складывают. В числителе меньший стек за спиной. 80/10 = 8."]},"dirty":{"topic":5,"prompt":"Вы держите A♥ 5♥ на K♥ 8♥ 2♣. Если соперник держит K♣ K♦, что даст вам 2♥ на тёрне?","options":["Выигрышный натсовый флеш","Флеш, который уже проигрывает","Пока четыре червы"],"answer":1,"why":["Флеш действительно старший среди флешей, но K♣ K♦ вместе с K♥ 2♣ 2♥ составляют фулл-хаус.","У вас пять червей, у соперника три короля и две двойки. Поэтому 2♥ усиливает вашу комбинацию, но не даёт победы.","Две червы в руке и три на столе дают флеш. Спаривание двоек одновременно даёт сопернику фулл-хаус."]},"freq":{"topic":6,"prompt":"Кто чаще добровольно входил в этих восьми раздачах?","options":["Анна","Борис","Поровну"],"answer":2,"why":["У Анны пять коллов и одно повышение. У Бориса один колл и пять повышений. Итого по 6/8.","У Бориса больше повышений, но колл тоже считается добровольным входом. У обоих по 6/8.","У каждого шесть входов из восьми. Это наблюдаемая частота 75% в записи."]},"agg":{"topic":6,"prompt":"Кто чаще повышал среди своих добровольных входов?","options":["Анна","Борис","Поровну"],"answer":1,"why":["У Анны одно повышение из шести входов. У Бориса пять из шести.","У Бориса 5/6 ≈ 83%, у Анны 1/6 ≈ 17%. Частоты относятся к действиям до флопа в этой выборке.","Число входов совпадает, а состав действий различается: 1/6 и 5/6."]},"few":{"topic":6,"prompt":"У Веры наблюдалось только два решения, оба раза сброс. Как часто она блефует на ривере?","options":["Редко","Часто","Пока мало данных"],"answer":2,"why":["Два фолда произошли до флопа. Ни одной возможности блефовать на ривере в журнале нет.","В журнале есть только два префлоп-фолда. О блефах на другой улице данных нет.","Даже десятки входов до флопа не заменят наблюдений за ставками на ривере."]},"callA":{"topic":6,"prompt":"Анна поставила 1 000. Против её диапазона ставок ваша пара обыгрывает 1 руку из 10 равновероятных. Что выгоднее?","options":["Сброс","Колл 1 000"],"answer":0,"why":["Эквити 10%, нужно 25%. Колл в среднем даёт 0,10 × 4 000 − 1 000 = −600 фишек. Сброс сохраняет доплату.","Из итогового банка 4 000 вам в среднем возвращается 400. Колл стоит 1 000, ожидание −600."]},"callB":{"topic":6,"prompt":"Борис делает ту же ставку. Теперь ваша пара обыгрывает 4 руки из 10 равновероятных. Ваш ход?","options":["Сброс","Колл 1 000"],"answer":1,"why":["По заданной модели вы выигрываете 40% при пороге 25%. Сброс упускает ожидаемые 600 фишек.","0,40 × 4 000 − 1 000 = +600 фишек. Если оценка его блефов опустится ниже четверти, решение изменится."]},"bubble":{"topic":7,"prompt":"В модели двух равных призов выше у вас 55% шансов выиграть. Стоит ли коллировать ради призовых?","options":["Да, 55% больше половины","Нет, сброс сохраняет большую денежную долю"],"answer":1,"why":["Победа приносит 100, вылет — 0. Денежное ожидание колла 55, а сброс сохраняет около 66,7.","По деньгам 0,55 × 100 = 55 меньше 66,7. При иных выплатах, стеках и заметных блайндах нужен новый расчёт."]},"finalOpen":{"topic":1,"prompt":"Все сбросили. Как начать с Q♠ J♠ на баттоне при 30 ББ?","options":["Сброс","Колл 1 000","Повышение до 2 200"],"answer":2,"why":["Вы впереди части рук защиты и будете в позиции. Сброс теряет перспективный вход.","Лимп может входить в специальную стратегию, но здесь блайнды редко повышают, а большой часто платит руками слабее. Небольшой рейз соответствует плану.","Рейз может забрать 2 500 сразу. При колле сохраняются позиция и возможность собрать старшую пару или сильное дро."]},"finalOut":{"topic":5,"prompt":"На флопе K♦ 10♣ 2♥ соперник чекает. Какие ранги сразу закончат ваш стрит?","options":["Только туз","Туз и девятка","Дама и валет"],"answer":1,"why":["Туз даёт 10–J–Q–K–A. Девятка также подходит: 9–10–J–Q–K.","По четыре туза и девятки — восемь карт на следующую улицу. Дама или валет дадут пару.","Дама и валет улучшают до пары. Пять карт подряд получаются с девяткой или тузом."]},"finalCall":{"topic":4,"prompt":"После вашего чека тёрн 4♠. Большой блайнд ставит 1 000 в 5 900. Чистый стрит даст восемь аутов. Как ответить по фишкам?","options":["Сброс","Колл 1 000"],"answer":1,"why":["Цена 1 000 / 7 900 ≈ 12,7%. Восемь карт из 46 дают около 17,4%. Сброс упускает прибыль по указанной модели.","На ривере все восемь карт дадут старший возможный стрит. В модели без блокеров и делёжек 8/46 > 1 000/7 900. При промахе вы можете сбросить на ставку."]},"finalValue":{"topic":6,"prompt":"Ривер 9♦, соперник чекает. Модель соперника: он оплатит 3 000 с вероятностью 70%, а олл-ин — с вероятностью 5%. Руки QJ у него нет. Как получить больше фишек?","options":["Чек вслед","Ставка 3 000","Олл-ин 26 800"],"answer":1,"why":["Вы собрали старший возможный стрит. Чек сохраняет выигрыш банка, но упускает доплату его многочисленных пар.","К уже выигранному банку ставка прибавляет в среднем 0,70 × 3 000 = 2 100. У олл-ина добавка 0,05 × 26 800 = 1 340. Из двух размеров лучше 3 000.","От олл-ина ожидаемая доплата 1 340 фишек, от ставки 3 000 — 2 100. Для преимущества олл-ина сопернику нужно отвечать чаще чем в 2 100 / 26 800 ≈ 7,8% случаев."]}};
const books=[{"name":"Харрингтон о холдеме","by":"Дэн Харрингтон и Билл Роберти · том 1 · DOC в архиве","ref":{"title":"Харрингтон и Роберти. Открыть архив","href":"../Харрингтон Дэн. Харрингтон о холдеме том 1 - royallib.com.doc.zip"},"items":[["Обязательные платежи","В части «Игра в безлимитный холдем» найдите вопрос о стеке относительно блайндов и анте. Сравните круг с BBA и круг с индивидуальным анте. Расчёт числа кругов предполагает неизменный уровень."],["Позиция и игроки позади","Часть «Стили игры и стартовый минимум силы», задача 2–5. При Q♣ J♦ в ранней позиции два агрессивных игрока за спиной повышают риск ререйза. Смените позицию в той же раздаче и пересчитайте число будущих решений."],["Ауты и наблюдения","«Выгода от пота и анализ хэнда», раздел «Расчет аутов», и «Чтение стола», задачи 3–1 и 3–5. Отделите карты улучшения от чистых аутов, а единичный показ блефа от устойчивой привычки."]],"units":[1,2,5]},{"name":"Strategies for Beating Small Stakes Poker Tournaments","by":"Джонатан Литтл · турниры с небольшими бай-инами","ref":{"title":"Джонатан Литтл. Introduction · печ. 4 / PDF 5","href":"../Small-Stakes-Poker-Tournaments.pdf#page=5"},"items":[["Мелкая пара и глубина","Introduction, печ. 4 / PDF 5. При 30 ББ часть рук вроде 44 и 9♠ 7♠ теряет потенциальную оплату, особенно в ранней позиции. Сравните ту же руку при 100 ББ и оцените риск повышения позади."],["Два разных широких диапазона","Those who play too many hands too passively и … too aggressively, печ. 13 и 18 / PDF 14 и 19. Сосчитайте входы и повышения по отдельности. Для ставки на добор перечислите худшие руки, которые действительно заплатят."],["Наблюдаемое действие","Pay attention!, печ. 37 / PDF 38. Запишите позицию, размер ставки и показанную руку. Для вывода о частоте потребуется и число похожих возможностей."]],"units":[1,6,8]},{"name":"Безлимитный холдем. Теория и практика","by":"Дэвид Склански и Эд Миллер","ref":{"title":"Склански и Миллер. «Важность потенциальных шансов» · с. 36","href":"../03_05.pdf#page=36"},"items":[["Будущая оплата","«Важность потенциальных шансов», с. 36–40. Прикиньте, сколько в среднем получите, если дро закроется. Учтите фолды соперника и возможность проиграть после попадания."],["Следующая ставка","«Молот будущих ставок», с. 56–57. Для пограничного колла на тёрне заранее назовите ответ на крупную ставку по пустому риверу."],["Зачем повышать","«Рейз для кражи блайндов», с. 93, и «Влияние размера стека», с. 119. Сравните ценность уже собранного банка при 10 и 100 ББ. На с. 93 кэш-пример предполагает около 100 ББ. Для турнира заново учтите анте, эффективный стек и выплаты."]],"units":[2,3,4]},{"name":"Стратегия для СНГ","by":"Коллин Мошман · одностоловые турниры","ref":{"title":"Коллин Мошман. «Модель Независимых Фишек (ICM)» · с. 114","href":"../05.pdf#page=114"},"items":[["Высокие блайнды и анте","«Фундаментальная теорема высоких блайндов», с. 126–127, и «Анте: стратегические изменения», с. 136–137. Сравните скорость уменьшения стека с анте и без него. Диапазон пуша зависит ещё и от коллеров."],["Колл чужого пуша","«Коллирование чужих ставок ва-банк на большом блайнде», с. 160–164. Вычтите живой блайнд из доплаты и сравните цену с эквити против диапазона пуша."],["Турнирная доля","ICM, с. 114–116, «Игра на баббле», с. 141–142, «Различия между СНГ и МТТ», с. 204–205. Подставьте конкретную структуру призов. Давление одностолового баббла нельзя численно переносить на ранний этап большого турнира."]],"units":[7]},{"name":"Профессиональная игра в безлимитный холдем","by":"Мэтт Флинн, Санни Мейта и Эд Миллер · том I","ref":{"title":"Флинн, Мейта и Миллер. Гл. 1, «Ауты» · с. 13","href":"../23.pdf#page=13"},"items":[["Сколько аутов чистые","Гл. 1, «Ауты» и «Дисконтирование аутов», с. 13–14. Отметьте все карты на флеш, затем уберите карты, которые одновременно дадут известному сопернику более сильную комбинацию."],["Предел риска","«Эффективные размеры стеков», с. 24–25, и «Вычисление SPR», с. 97–98. Разделите меньший стек за спиной на банк в начале флопа. Целевые SPR из кэш-примеров не определяют автоматически решение на весь турнирный стек."],["Диапазон и цель ставки","Гл. 3, процесс REM, с. 58–66, и «Причины для бета или рейза», с. 68–71. После действия соперника пересмотрите возможные руки. Для добора укажите худшие руки, которые ответят, для блефа — лучшие, которые сбросят."]],"units":[3,4,5,6,8]}];
const lessons=[
 {title:'Какие две карты играть',short:'Стартовые руки и позиция',goal:'Пересадите себя с первой позиции на катофф и баттон. Какой флоп вам нужен и сколько игроков ещё могут повысить?',lab:'Атлас стартовых рук',keys:['earlyK','lateK','aceValue'],read:harr('«Стили игры и стартовый минимум силы», задача 2–5'),extra:little('Introduction',4),pass:'Объясните, почему K8o можно открыть с баттона против сдающихся блайндов и сбросить первым из шести.',

 ['С чего начать турнир','За столом шесть человек, у всех по 30 больших блайндов. Пока до вас все сбросили, есть простой базовый план: с сильными руками открыть торги небольшим повышением, со слабыми — сбросить. Открытие до 450 при блайндах 100/200 означает, что вы вкладываете всего 450. Вы сможете выиграть обязательные ставки сразу или получить колл от руки слабее.'],
 ['Разберите свою руку по двум признакам','Пара уже готова: с Q♣ Q♦ вы впереди всех непарных рук до флопа в одиночном сравнении по рангу комбинации. Две крупные карты вроде A♣ Q♦ часто дают старшую пару с хорошей второй картой — кикером. K♣ 8♦ тоже попадёт в короля, но против KQ заплатит старшей паре с лучшим кикером. Именно такие вторые по силе руки обходятся дорого.'],
 ['Зачем нужны масть и соседние ранги','У J♠ 10♠ есть пути к стриту и флешу. У J♠ 4♦ эти пути гораздо уже. Одномастность добавляет возможности, но K♠ 4♠ всё ещё рискует проиграть лучшему королю и старшему флешу. В атласе s означает одну масть, o — разные масти. У карманной пары суффикса нет.'],
 ['Кто скажет слово после вас','Порядок до флопа за столом из шести: UTG → HJ → CO → BTN → SB → BB. UTG действует первым, CO сидит справа от баттона, BTN — место с кнопкой дилера. На баттоне после вас только два блайнда, а после флопа вы увидите действия всех оставшихся до своего хода. Середина очереди требует промежуточного отбора. Например, K8o можно отложить даже на CO, если на баттоне любят повышать.'],
 ['Базовый отбор для начала','При 30 ББ и обычной защите на ранней позиции опирайтесь на крупные пары, AK, AQ и сильные одномастные старшие карты. Поздно добавляйте часть младших пар, одномастных связок и сильных разномастных рук. Для пограничного входа назовите конкретную причину: часто забираете блайнды, получаете оплату слабее или хорошо играете после колла. Атлас показывает примеры, точные частоты зависят от стола.']]},
 {title:'До вас уже вошли',short:'Лимп, рейз и несколько коллеров',goal:'Различайте две ситуации: люди недорого вошли в банк или один из них уже сделал крупное повышение.',lab:'Кто вошёл до вас',keys:['limpCost','queens','weakAce','freeBB'],read:skl('«Причины для рейза», раздел о рейзе для изоляции',91),extra:harr('«Торговля до флопа»'),pass:'Посчитайте цену после двух лимпов и объясните, почему QQ и слабый туз используют её по-разному.',

 ['Три разных входа','До вас все сбросили — вы можете открыть банк. Игрок уравнял большой блайнд — это лимп. Игрок повысил — теперь колл стоит размер его ставки за вычетом вашей живой ставки. Перед решением назовите, кто уже проявил силу и кто ещё может переставить.'],
 ['Когда люди охотно платят','На баттоне с QQ против двух игроков, вошедших по 200, вы хотите получить оплату от младших пар и худших старших карт. Повышение до 1 000 в нашем примере одновременно собирает фишки с этих рук и уменьшает вероятность дешёвого флопа на четверых. Размер подбирают под глубину и реакцию стола. Если дают колл только руки сильнее, пересмотрите цель.'],
 ['Когда хочется присоединиться дёшево','С 9♠ 8♠ на баттоне при 60 ББ недорогой колл за несколькими пассивными игроками может дать флоп в позиции. Нужны спокойные блайнды за спиной и достаточные остатки для оплаты сильного попадания. С A♦ 4♣ одна пара туза часто поставит вас перед дорогим выбором против лучшего туза. Одинаковая доплата даёт разным рукам разные перспективы.'],
 ['Большой банк и сильная рука — разные величины','В банке 700, ваш колл 200 сделает его 900. За вами ещё SB и BB: они могут повысить. Даже если все увидят флоп, побеждать придётся нескольких игроков. Старшая пара со слабым кикером теряет ценность; стриты и сильные флеши чаще выдерживают крупную торговлю. На четвёртом занятии вы сравните тот же эффект на ривере, когда дальнейших ставок уже нет.'],
 ['Если вместо лимпа был рейз','При тех же 100/200 игрок UTG повысил до 800. Один колл теперь стоит четыре больших блайнда. Сравните его диапазон с вашим и проверьте остатки. Колл с мелкой парой только ради сета требует будущей оплаты. Против короткого стека главного источника такой оплаты может просто не оказаться.']]},
 {title:'Что меняют 60, 30 и 12 ББ',short:'Глубина стека и план на флоп',goal:'Оставьте себе 12 000 фишек и поднимите блайнды. Сравните, сколько решений останется после колла.',lab:'Один стек на трёх уровнях',keys:['depth30','set12','spr'],read:fly('«Эффективные размеры стеков»',24),extra:fly('«Вычисление SPR»',97),pass:'Переведите 12 000 в ББ на каждом уровне и назовите, что ограничивает выигрыш в раздаче между двумя игроками.',
 theory:[
 ['Как вспомнить, что такое 30 ББ','Разделите свои фишки на большой блайнд. 12 000 при 100/200 — это 60 ББ. При 200/400 те же фишки дают 30 ББ, а при 500/1 000 всего 12 ББ. Поэтому изменение стратегии возможно даже после круга, в котором вы ни разу добровольно не играли.'],
 ['Чьи фишки действительно в игре','У вас 60 ББ, у единственного соперника 12 ББ. Он может разыграть с вами только по 12 ББ с каждой стороны. Это эффективный стек. Если соперников двое с разными остатками, отдельно оцените, сколько можно выиграть у каждого.'],
 ['Глубоко: мелкая пара покупает возможность','С 5♠ 5♦ на флопе хотя бы одна из двух оставшихся пятёрок появится примерно в 11,8% случаев. За колл приходится платить и в остальных раздачах. При эффективных 60 ББ, позиции и склонности соперника много платить с одной парой, редкое попадание иногда окупает промахи. Учитывайте фолды соперника после попадания и редкие поражения с сетом.'],
 ['Средняя глубина: план до колла','При 30 ББ открытие до 3 ББ забирает десятую часть исходного стека. Пары и старшие карты всё ещё могут играть после флопа, но меньше места для дорогих погонь за редкой комбинацией. Спросите заранее: какие флопы я продолжу, как отвечу на повторное повышение и сколько удастся выиграть?'],
 ['Коротко: первым поставить и ответить на пуш','При 12 ББ открытый пуш может выиграть блайнды сразу. При колле чужого пуша соперник уже не сбросит. A5s может быть кандидатом на первый пуш с поздней позиции при подходящих блайндах, но той же руке часто не хватает эквити для колла узкого пуша. Ни 12, ни 15 ББ не превращают каждую раздачу в обязательный олл-ин.'],
 ['Сколько банков осталось за спиной','На начало флопа в банке 10 ББ, у двух участников осталось 25 и 60. Отношение эффективного остатка к банку, SPR, равно 25/10 = 2,5. Если меньший остаток 80 ББ, SPR уже 8. Чтобы с одной парой выиграть или проиграть весь стек во втором случае, понадобится заметно более крупная торговля.']]},
 {title:'Стоит ли платить за банк',short:'Цена колла в одиночном и общем банке',goal:'Меняйте ставку и число коллеров. Сначала узнайте цену, затем проверьте свою долю выигрыша против всех оставшихся рук.',lab:'Калькулятор колла на ривере',keys:['singlePrice','multiPrice','multiEV'],read:fly('«Шансы к банку»',12),extra:skl('«Молот будущих ставок»',56),pass:'Объясните, как колл за 500 может быть выгоден против одного игрока и убыточен в большем банке.',

 ['Что сравниваем','Эквити — ваша ожидаемая доля банка на вскрытии. Например, если вы выигрываете 30% раздач без делёжек, ваше эквити равно 30%. На ривере, когда ваш колл завершает торговлю, минимальная необходимая доля равна доплате, делённой на итоговый банк. Вложенные раньше фишки уже находятся в центре.'],
 ['Пример на фишках','Было 1 000, соперник поставил 500. Колл стоит 500, в итоге будет 2 000. Для окупаемости достаточно выигрывать один раз из четырёх. При победе вы получаете 1 500 сверх возвращённого колла, при поражении теряете 500. За четыре такие раздачи одна победа и три поражения дают ноль.'],
 ['Почему несколько коллов меняют ответ','Если перед вами ещё двое уже уравняли по 500, итоговый банк составит 3 000. Порог упал до 16,7%. Но рука должна обыграть и ставившего, и обоих коллеров. Если раньше вы оценивали свою долю в 30%, а теперь всего в 12%, ставка с хорошей ценой всё равно слишком дорога. Эти проценты заданы для примера. В реальной игре оцените их заново по диапазонам.'],
 ['От цены к решению','Ожидание колла относительно сброса = эквити × итоговый банк − доплата. При 12% и банке 3 000 это 360 − 500 = −140. В калькуляторе оставьте банк прежним и поменяйте только оценку эквити. Найдите, при какой доле знак меняется.'],
 ['На флопе добавьте будущие ставки','Если соперник с фишками за спиной, на тёрне он может попросить ещё. На флопе колл обычно покупает только следующую карту. Будущая оплата удачного дро и будущие потери со второй лучшей рукой меняют расчёт. Напрямую сравнивать эквити до ривера с ценой особенно удобно, когда колл уже гарантирует вскрытие.']]},
 {title:'Какие карты вас спасают',short:'Ауты, одна карта и две',goal:'Выберите карты усиления своими руками и сравните шанс достроить комбинацию с ценой ставки.',lab:'Что может прийти',keys:['flush','straight','dirty'],read:fly('«Ауты» и «Дисконтирование аутов»',13),extra:harr('«Выгода от пота и анализ хэнда», раздел «Расчет аутов»'),pass:'Соберите оба набора карт и верно отличите флеш от выигрышного флеша.',

 ['Аут на комбинацию и аут на победу','A♥ 5♥ на K♥ 8♥ 2♣: видны четыре червы, в колоде остаётся девять. Каждая из девяти закроет флеш. Проверьте соперника: если у него сет королей, 2♥ спаривает доску и даёт ему фулл-хаус. В этой конкретной паре рук такая черва не выводит вас вперёд.'],
 ['Стрит с двух сторон','8♠ 7♠ на 6♦ 9♣ K♥ образуют последовательность 6–7–8–9. Любая пятёрка или десятка даёт стрит — восемь карт. Если на столе 6♦ 10♣ K♥, для завершения стрита нужна девятка: остаются четыре карты. При одновременном стрит-дро и флеш-дро совпадающие карты учитываются один раз.'],
 ['47 неизвестных на флопе','Две карты у вас и три на столе, поэтому следующая карта — одна из 47. С девятью картами усиления шанс на тёрне равен 9/47 ≈ 19,1%. Чтобы получить вероятность хотя бы одного попадания за две карты, вычтите из единицы вероятность двух промахов: 1 − (38/47 × 37/46) ≈ 35%.'],
 ['После пустого тёрна пересчитайте','Осталась одна общая карта и 46 неизвестных, если вы не знаете карт соперника. Восемь аутов на стрит теперь дают 8/46 ≈ 17,4%. Если известны обе карты соперника, они тоже исчезают из набора неизвестных. В тренажёрах для расчёта колла принимаем, что каждое попадание выигрывает, каждый промах проигрывает и делёжек нет.']]},
 {title:'Как читать игроков',short:'Наблюдение, диапазон и проверка гипотезы',goal:'Сравните двух соперников с одинаковой частотой входа. Решите, когда одна пара может поймать блеф.',lab:'Досье за столом',keys:['freq','agg','few','callA','callB'],read:little('Those who play too many hands too passively',13),extra:little('Those who play too many hands too aggressively',18),pass:'Посчитайте два отдельных показателя и защитите два разных решения на одинаковом ривере.',

 ['Что именно записать','Заметка «с баттона уравнял рейз с K8o, на пустом ривере поставил половину банка с промахом» полезнее слова «агрессивный». Она связывает место, ход, размер и показанные карты. Руки, которые не дошли до вскрытия, всё ещё неизвестны. Два фолда до флопа ничего не говорят о частоте блефа на ривере.'],
 ['Представьте несколько рук','На J♦ 8♠ 4♥ 2♣ K♥ ваша J♣ 9♣ выигрывает у части промахнувшихся дро, но проигрывает королю и более сильным готовым рукам. Если соперник ставит за вэлью, он рассчитывает получить колл хуже. Если блефует, ему нужен фолд лучшей руки. Назовите примеры обеих групп, прежде чем вводить частоту блефа.'],
 ['Приспосабливайтесь к конкретной ошибке','Против игрока, который часто платит со слабой парой, ищите больше ставок на добор. Если он после серии чеков внезапно ставит крупно, прежние коллы ещё не говорят, как часто он блефует. Для такого решения нужны данные о похожих ставках. Ниже для ривера заданы отдельные диапазоны, чтобы вы могли проверить математику.']]},

 ['Когда в турнире появляется анте','Расписание определяет организатор. В одном турнире анте действует с первой раздачи, в другом появляется на позднем уровне. Здесь мы ввели его после базовой игры, чтобы было видно, какая именно величина меняется. Анте большого блайнда (BBA) вносит один игрок за весь стол сверх своего блайнда. Это отдельные фишки в банке.'],
 ['Почему стартовый банк крупнее','При 100/200 без анте в центре 300. С BBA 200 уже 500. Когда баттон открывает до 450, большой блайнд доставляет 250 в обоих случаях, но борется за больший банк при анте. Сравните две цены сами: без анте 250/1 000 = 25%, с анте 250/1 200 ≈ 20,8%, если малый блайнд сбросил.'],
 ['Три игрока вместо шести','При постоянном BBA за один полный круг каждый платит один SB, один BB и одно анте. Круг при 100/200 и BBA 200 стоит 500 при любом из этих двух составов. Втроём это 500 за три раздачи, вшестером — за шесть. На баттоне втроём до вас никто не ходит; за шестиместным столом до баттона должны были сбросить три игрока.'],
 ['Уровень вырос или стек уменьшился?','Стек 12 000 при 100/200 — это 60 ББ. При 500/1 000 он же даёт 12 ББ. Включите BBA в лаборатории: количество ББ останется прежним, а стоимость круга возрастёт. Сократите число мест: фишки будут уходить за меньшее число раздач. При индивидуальном анте каждый платит каждую раздачу, тогда формула круга другая: SB + BB + число игроков × индивидуальное анте.'],
 ['У призов: сколько стоит вылет','ICM оценивает денежную долю по выплатам и стекам. У троих равные стеки, два одинаковых приза по 100, блайнды в модели пренебрежимо малы. Сейчас доля каждого около 66,7. При колле на весь стек против равного соперника победа гарантирует 100, вылет даёт 0. Даже 55% шансов дают лишь 55 по деньгам. В настоящем МТТ считайте конкретные выплаты, стеки и игроков, которых вы покрываете.']]},
 {title:'Одна раздача от начала до конца',short:'Префлоп, флоп, тёрн и ривер',goal:'Примените отбор рук, цену колла и чтение соперника за одним столом. После ривера скопируйте свой отчёт.',lab:'Линия игры',keys:['finalOpen','finalOut','finalCall','finalValue'],read:fly('Глава 3, процесс REM, диапазон рук',58),extra:little('Pay attention!',37),pass:'Объясните каждое из четырёх решений и выберите тему для следующей тренировки.',

function describeAnswer(id,value){

  '; шанс на тёрн '+(f.numbers[0]||'…')+'%, до ривера '+(f.numbers[1]||'…')+'%, цена колла '+(f.numbers[2]||'…')+'%; ход — '+({call:'колл',fold:'сброс'}[f.move]||'ещё не выбран');
}
function initJournal(){
 record.notes??={};
 if(record.journal)return;
 record.journal={};
 for(const [id,a] of Object.entries(record.answers)){
  if(!questions[id]&&!draws[id])continue;
  record.journal[id]=[{legacy:true,first:a.first,ok:a.ok,text:describeAnswer(id,a.value)}];
 }
 save();
}
function hasDrawDraft(id){
 const form=record.draws[id];
 return form && (form.selected.length>0 || form.numbers.some(v=>v.trim()) || Boolean(form.move));
}

function buildReport(){
 const groups=[{title:'Входная диагностика',keys:diagnostics.map(d=>d[0])},...lessons.map((l,i)=>({title:'Занятие '+(i+1)+'. '+l.title,keys:l.keys}))];
 const topics=[...new Set(Object.values(record.mistakes))].sort((a,b)=>a-b);
 const lines=['Учебный стол — мой отчёт для разбора','Многостоловые турниры по безлимитному холдему с анте.',
  'Освоено занятий: '+doneCount()+' из '+lessons.length+'.',
  'Темы, где были ошибки: '+(topics.map(n=>n+'. '+lessons[n-1].title).join(', ')||'пока не отмечены')+'.'];
 if(record.explored && Object.keys(record.explored).length){
  lines.push('','Что я менял в разборах за столом:');
  for(const [n,values] of Object.entries(record.explored))lines.push('• '+lessons[n-1].title+': '+(record.explorations?.[n]?.length?[...new Set([...Object.values(values),...record.explorations[n]])]:Object.values(values)).join(', ')+'.');
 }
 for(const group of groups){
  const ids=group.keys.filter(id=>record.journal[id]?.length||record.notes[id]||record.mistakes[id]||hasDrawDraft(id));
  lines.push('',group.title+' — сейчас верно '+group.keys.filter(isRight).length+' из '+group.keys.length+'.');
  if(!ids.length){lines.push('Ответов пока нет.');continue;}
  for(const id of ids){
   const history=record.journal[id]||[];
   const d=draws[id];
   lines.push('• '+(questions[id]?.prompt||d.title));
   if(reportContexts[id])lines.push('  Условия: '+reportContexts[id]);
   if(d)lines.push('  '+d.hand.join(' ')+' на '+d.flop.join(' ')+'. '+d.horizon);
   let attempt=0,lastNote='';
   for(const entry of history){
    if(entry.reset){
     if(entry.note&&entry.note!==lastNote)lines.push('  Заметка перед повтором: '+entry.note);
     lines.push('  Начал упражнение заново.');lastNote='';continue;
    }
    const verdict=entry.ok?'верно':'ошибка';
    if(entry.legacy){
     lines.push('  До обновления: последняя запись — '+entry.text+' ('+verdict+'). Первая попытка была '+(entry.first?'верной':'с ошибкой')+'. Подробной истории нет.');
    }else{
     attempt++;
     lines.push('  Попытка '+attempt+': '+entry.text+' — '+verdict+'.');
     if(entry.note)lines.push('  Моё объяснение при ответе: '+entry.note);
    }
    lastNote=entry.note||'';
   }
   if(!history.length&&record.mistakes[id])lines.push('  Ошибка отмечена в прежней версии. Выбранный вариант не сохранился.');
   if(record.notes[id]&&record.notes[id]!==lastNote)lines.push('  Заметка: '+record.notes[id]);
   if(!answered(id)){
    lines.push('  В текущей попытке ответ ещё не проверен.');
    if(hasDrawDraft(id))lines.push('  Незавершённый расчёт: '+describeAnswer(id,null)+'.');
   }
  }
 }
 lines.push(...trainingReport());
 lines.push('','Разбери мои решения. Сначала выбери одну повторяющуюся или важную ошибку, объясни её на моей раздаче и дай похожую задачу с одним изменённым условием.');
 return lines.join('\n');
}

}
async function copyReport(panel,text=buildReport()){
 const preview=panel.querySelector('.report-preview'),status=panel.querySelector('.copy-status');
 preview.value=text;
 try{
  await navigator.clipboard.writeText(text);
  status.textContent='Отчёт скопирован. Вставьте его в чат.';
 }catch{
  const detail=panel.matches('details')?panel:panel.querySelector('details');detail.open=true;
  preview.focus();preview.select();preview.setSelectionRange(0,text.length);
  let copied=false;
  try{copied=document.execCommand('copy');}catch{}
  status.textContent=copied?'Отчёт скопирован. Вставьте его в чат.':'Текст отчёта выделен. Нажмите ⌘C или Ctrl+C. На телефоне выберите «Скопировать» в меню выделения.';
 }
}

function recordAnswer(id,topic,ok,value){

const draws={
 flush:{title:'Флеш-дро с тузом',hand:['A♥','5♥'],flop:['K♥','8♥','2♣'],outs:9,pot:1000,bet:500,need:'флеш',suit:'♥',horizon:'Соперник поставил последние 500 на флопе. Вы покрываете его, других игроков нет. Колл открывает обе оставшиеся карты.',goal:'на флеше',isOut:c=>c.endsWith('♥'),call:true},
 straight:{title:'Стрит с двух сторон',hand:['8♠','7♠'],flop:['6♦','9♣','K♥'],outs:8,pot:1200,bet:600,need:'стрит',suit:'♠',horizon:'Флоп прошёл чеком. На тёрне вышла 2♠. Соперник поставил последние 600 в 1 200. Для решения осталась только одна карта.',goal:'на стрите',isOut:c=>['5','10'].includes(c.slice(0,-1)),call:false}
};
function getForm(id){
 if(!record.draws[id]) record.draws[id]={suit:draws[id].suit,selected:[],numbers:['','',''],move:''};
 return record.draws[id];
}
function odds(d){
 const one=d.outs/47, two=1-(47-d.outs)/47*(46-d.outs)/46;
 return [one,two,d.bet/(d.pot+2*d.bet)].map(x=>x*100);
}
const universe=Object.keys(suitNames).flatMap(s=>ranks.map(r=>r+s));
function drawAnswers(d){
 const visible=[...d.hand,...d.flop];
 return universe.filter(c=>!visible.includes(c)&&d.isOut(c));
}
function drawEvaluation(id){
 const d=draws[id],f=getForm(id),wanted=drawAnswers(d),vals=odds(d);
 const missing=wanted.filter(c=>!f.selected.includes(c)),extra=f.selected.filter(c=>!wanted.includes(c));
 const numberOK=vals.map((val,i)=>f.numbers[i].trim()!==''&&Math.abs(Number(f.numbers[i].replace(',','.'))-val)<=0.501);
 const moveOK=f.move===(d.call?'call':'fold');
 return {ok:!missing.length&&!extra.length&&numberOK.every(Boolean)&&moveOK,missing,extra,numberOK,moveOK};

function buildReport(){

  'Темы, где были ошибки: '+(topics.map(n=>n+'. '+lessons[n-1].title).join(', ')||'пока не отмечены')+'.'];
 for(const group of groups){
  const ids=group.keys.filter(id=>record.journal[id]?.length||record.notes[id]||record.mistakes[id]||hasDrawDraft(id));
  lines.push('',group.title+' — сейчас верно '+group.keys.filter(isRight).length+' из '+group.keys.length+'.');
  if(!ids.length){lines.push('Ответов пока нет.');continue;}
  for(const id of ids){

   const d=draws[id];
   lines.push('• '+(questions[id]?.prompt||d.title));

   if(d)lines.push('  '+d.hand.join(' ')+' на '+d.flop.join(' ')+'. '+d.horizon);
   let attempt=0,lastNote='';
   for(const entry of history){
    if(entry.reset){
     if(entry.note&&entry.note!==lastNote)lines.push('  Заметка перед повтором: '+entry.note);
     lines.push('  Начал упражнение заново.');lastNote='';continue;

    if(entry.legacy){
     lines.push('  До обновления: последняя запись — '+entry.text+' ('+verdict+'). Первая попытка была '+(entry.first?'верной':'с ошибкой')+'. Подробной истории нет.');
    }else{
     attempt++;
     lines.push('  Попытка '+attempt+': '+entry.text+' — '+verdict+'.');
     if(entry.note)lines.push('  Моё объяснение при ответе: '+entry.note);
    }
    lastNote=entry.note||'';
   }
   if(!history.length&&record.mistakes[id])lines.push('  Ошибка отмечена в прежней версии. Выбранный вариант не сохранился.');
   if(record.notes[id]&&record.notes[id]!==lastNote)lines.push('  Заметка: '+record.notes[id]);
   if(!answered(id)){
    lines.push('  В текущей попытке ответ ещё не проверен.');
    if(hasDrawDraft(id))lines.push('  Незавершённый расчёт: '+describeAnswer(id,null)+'.');
   }
  }
 }
 lines.push('','Разбери мои решения. Сначала выбери одну повторяющуюся или важную ошибку, объясни её на моей раздаче и дай похожую задачу с одним изменённым условием.');

}

function route(){

function integrateChapters(content){
 for(const chapter of content){
  const n=chapter.n,keys=[];
  for(const [i,task] of chapter.tests.entries()){
   const key='mtt'+n+'q'+(i+1),s=task.scene;
   keys.push(key);questions[key]=q(n,task.prompt,task.options,task.answer,task.why);
   cases[key]=s;
   reportContexts[key]=[s.street,s.hero+' · '+s.hand.join(' '),s.boardCards.join(' '),s.blind,'стек '+s.stack,'банк '+nfmtOrText(s.pot),...Object.entries(s.actions).map(([seat,act])=>seat+' '+act),s.note].filter(Boolean).join(' / ');
  }
  lessons.push({title:chapter.title,short:chapter.short,goal:chapter.goal,theory:chapter.theory,pass:chapter.pass,lab:chapter.lab.title,keys});
  const bookRefs=(chapter.book||[]).map(([title,url])=>source(title,'../'+url));
  for(const ref of bookRefs){
   const b=books.find(b=>b.ref.href.split('#')[0]===ref.href.split('#')[0]);
   if(b&&!b.units.includes(n))b.units.push(n);
  }
  researchNotes.push({...chapter.worked,refs:bookRefs,web:chapter.web.map(([title,url])=>source(title,url))});
  const variants=chapter.lab.variants;
  labs[n-1]=()=>{
   const key='spot'+n,index=Number(cfg()[key])||0;
   const active=variants[index]||variants[0];
   return felt(active.scene)+panel('Измените условие',select(chapter.lab.label,key,variants.map((v,i)=>pair(String(i),v.label))),active.headline,active.explanation);
  };
 }
}
